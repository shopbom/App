<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:#ffffff;
}

#viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:calc(100% - 65px);
border:none;
display:none;
}

#welcome{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#2874F0,#4A90E2);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:99999;
}

#bell{
font-size:90px;
animation:ring 1s infinite;
}

@keyframes ring{
0%{transform:rotate(0deg);}
25%{transform:rotate(15deg);}
50%{transform:rotate(-15deg);}
75%{transform:rotate(10deg);}
100%{transform:rotate(0deg);}
}

#welcome h1{
color:#fff;
margin-top:20px;
font-size:30px;
}

#welcome p{
color:#fff;
padding:20px;
text-align:center;
font-size:16px;
max-width:340px;
line-height:1.5;
}

#enableBtn{
padding:16px 30px;
border:none;
border-radius:50px;
background:#fff;
color:#2874F0;
font-size:18px;
font-weight:bold;
cursor:pointer;
box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.navigation{
position:fixed;
left:0;
bottom:0;
width:100%;
height:65px;
background:#fff;
border-top:1px solid #ddd;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
z-index:999;
}

.navigation a{
flex:1;
text-align:center;
text-decoration:none;
color:#666;
padding:8px 0;
transition:.3s;
}

.navigation a.active{
color:#2874F0;
}

.nav-icon{
width:32px;
height:32px;
display:block;
margin:auto;
margin-bottom:4px;
}

.text{
font-size:12px;
font-weight:bold;
}

</style>

</head>

<body>

<div id="welcome">

<div id="bell">🔔</div>

<h1>Enable Notifications</h1>

<p>
Turn on notifications to receive the latest updates,
offers and announcements instantly.
</p>

<button id="enableBtn">
Allow Notifications
</button>

</div>

<iframe id="viewer" src="https://shopbom.github.io/Me/"></iframe><div class="navigation">

<a href="#" class="active" data-url="https://shopbom.github.io/Me/">
<img class="nav-icon" src="https://i.ibb.co/HfyPtfpZ/file-00000000be20720692ee8230e29da463.png" alt="Home">
<span class="text">Home</span>
</a>

<a href="#" data-url="https://sites.google.com/view/bomoffer/home">
<img class="nav-icon" src="https://i.ibb.co/d4YVmKfz/file-000000000c2472068ef64626c20e75dc.png" alt="Offer">
<span class="text">Offer</span>
</a>

<a href="#" data-url="https://sites.google.com/view/multigamestore/home">
<img class="nav-icon" src="https://i.ibb.co/60ywts30/IMG-20260717-001730.png" alt="Y Store">
<span class="text">Y Store</span>
</a>

</div>

<script>

const viewer = document.getElementById("viewer");
const welcome = document.getElementById("welcome");
const enableBtn = document.getElementById("enableBtn");

const links = document.querySelectorAll(".navigation a");

/* Bottom Navigation */

links.forEach(link=>{

link.addEventListener("click",function(e){

e.preventDefault();

const url=this.dataset.url;

links.forEach(x=>x.classList.remove("active"));
this.classList.add("active");

if(url.includes("sites.google.com")){
window.location.href=url;
return;
}

viewer.src=url;

});

});

function openApp(){

welcome.style.display="none";
viewer.style.display="block";

}

/* Skip welcome if already completed */

if(localStorage.getItem("notificationDone")==="true"){

openApp();

}else{

async function askNotification(){

try{

if(window.OS){

await window.OS.Notifications.requestPermission();

}else if("Notification" in window){

await Notification.requestPermission();

}

}catch(e){

console.log(e);

}

localStorage.setItem("notificationDone","true");

openApp();

}

/* Allow button */

enableBtn.onclick=askNotification;

}/* If notification permission is already granted */

if (Notification.permission === "granted") {

localStorage.setItem("notificationDone","true");

openApp();

}

/* If notification permission is blocked */

if (Notification.permission === "denied") {

localStorage.setItem("notificationDone","true");

openApp();

}

</script>

</body>
</html>
