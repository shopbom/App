<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2874F0">

<title>Shop Bom</title>

<!-- OneSignal -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];

OneSignalDeferred.push(async function(OneSignal){

await OneSignal.init({

appId:"c5536a8a-47ee-45e6-ad57-9527b045b505",

notifyButton:{
enable:false
},

serviceWorkerPath:"/OneSignalSDKWorker.js",
serviceWorkerUpdaterPath:"/OneSignalSDKUpdaterWorker.js"

});

window.OS = OneSignal;

});
</script>

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0XNQDYTCYM"></script>

<script>
window.dataLayer = window.dataLayer || [];

function gtag(){
dataLayer.push(arguments);
}

gtag("js",new Date());
gtag("config","G-0XNQDYTCYM");
</script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:#ffffff;
}

#viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
border:none;
display:none;
}

#welcome{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#2874F0,#4A90E2);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:99999;
}

#bell{
font-size:90px;
animation:ring 1s infinite;
}

@keyframes ring{
0%{transform:rotate(0deg);}
25%{transform:rotate(15deg);}
50%{transform:rotate(-15deg);}
75%{transform:rotate(10deg);}
100%{transform:rotate(0deg);}
}

#welcome h1{
color:#fff;
margin-top:20px;
font-size:30px;
}

#welcome p{
color:#fff;
padding:20px;
text-align:center;
font-size:16px;
max-width:340px;
line-height:1.5;
}

#enableBtn{
padding:16px 30px;
border:none;
border-radius:50px;
background:#fff;
color:#2874F0;
font-size:18px;
font-weight:bold;
cursor:pointer;
box-shadow:0 8px 25px rgba(0,0,0,.2);
}

</style>

</head>

<body>

<div id="welcome">

<div id="bell">🔔</div>

<h1>Enable Notifications</h1>

<p>
Turn on notifications to receive the latest updates,
offers and announcements instantly.
</p>

<button id="enableBtn">
Allow Notifications
</button>

</div>

<iframe
id="viewer"
src="https://shopbom.github.io/Me/">
</iframe>
<script>

const viewer = document.getElementById("viewer");
const welcome = document.getElementById("welcome");
const enableBtn = document.getElementById("enableBtn");

function openApp(){

welcome.style.display = "none";
viewer.style.display = "block";

}

/* Skip welcome if already completed */

if(localStorage.getItem("notificationDone") === "true"){

openApp();

}else{

async function askNotification(){

try{

if(window.OS){

await window.OS.Notifications.requestPermission();

}else if("Notification" in window){

await Notification.requestPermission();

}

}catch(e){

console.log(e);

}

localStorage.setItem("notificationDone","true");

openApp();

}

/* Allow button */

enableBtn.onclick = askNotification;

}

/* If notification permission is already granted */

if(Notification.permission === "granted"){

localStorage.setItem("notificationDone","true");

openApp();

}

/* If notification permission is blocked */

if(Notification.permission === "denied"){

localStorage.setItem("notificationDone","true");

openApp();

}

</script>

</body>
</html>
